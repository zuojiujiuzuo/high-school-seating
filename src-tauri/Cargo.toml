[package]
name = "banzhen"
version = "0.1.0"
description = "班阵高中排座工作台"
authors = ["Banzhen Studio"]
edition = "2021"

[lib]
name = "banzhen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
